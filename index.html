html{background:#0c0c0c}body{margin:0;background:transparent;color:var(--fg);font:15px/1.4 Arial,Helvetica,sans-serif;position:relative;min-height:100vh}
body::before{content:'';position:absolute;left:0;right:0;top:0;height:min(64vw,380px);z-index:-1;background:linear-gradient(rgba(12,12,12,.1),#0c0c0c),var(--banner) top center/cover no-repeat}
*{box-sizing:border-box}main{max-width:720px;margin:0 auto;padding:min(36vw,200px) 12px 80px}
h1{font-size:18px;margin:4px 0 10px}small{display:block;color:var(--mut);font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.card,.row{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
.stats b{font-size:16px;display:block}.row{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;align-items:center}.row .r{text-align:right}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.bad{background:#ffc7ce;color:#9c0006}.warn{background:#ffeb9c;color:#7a4500}.ok{background:#c6efce;color:#006100}.mute{background:#e7e6e6;color:#555}
.badt{color:#ff6b6b;font-weight:700}.warnt{color:#ffc44d;font-weight:700}.okt{color:#5fd37a;font-weight:700}
input,select,textarea,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:9px;width:100%}
button{width:auto;cursor:pointer;font-weight:700}button.p{background:var(--red);color:#fff;border-color:var(--red)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.chips button{padding:5px 11px;border-radius:99px;white-space:nowrap}.chips .on{background:var(--red);color:#fff;border-color:var(--red)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;padding:14px 4px}nav .on{color:var(--red);box-shadow:inset 0 3px var(--red)}
#sheet{position:fixed;inset:0;background:rgba(12,12,12,.97);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 40px}#sheet>div{max-width:720px;margin:0 auto}
table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 12px}td,th{border-bottom:1px solid var(--ln);padding:5px 3px;text-align:left}
label{display:block;margin:8px 0 2px;font-size:12px;color:var(--mut)}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}a.b{padding:5px 10px;border:1px solid var(--ln);border-radius:8px;color:var(--fg);text-decoration:none;font-size:13px}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.kpi{margin:0!important;border-left:3px solid var(--red)}.kpi b{font-size:18px;display:block;margin:2px 0}.kpi[data-go]{cursor:pointer}
.meter{height:6px;background:#2a2a2a;border-radius:4px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#e60000,#5fd37a)}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.dn{display:flex;align-items:center;gap:10px}.dn>div{flex:1}.lgrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ln);cursor:pointer;font-size:13px}.card h3{margin:0 0 8px;font-size:14px}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0}.hb small{width:72px;margin:0}.hb .t{flex:1;display:flex;height:16px;background:#262626;border-radius:8px;overflow:hidden}.hb b{width:30px;text-align:right;font-size:13px}
#cover{position:fixed;inset:0;z-index:50;background:#0c0c0c;overflow:auto;display:flex;flex-direction:column}#cover[hidden]{display:none}
.hero{flex:0 0 44vh;min-height:230px;background:linear-gradient(rgba(12,12,12,0) 40%,#0c0c0c),var(--banner) center/cover no-repeat}
.cv{max-width:560px;width:100%;margin:-24px auto 0;padding:0 14px calc(24px + env(safe-area-inset-bottom,0px))}.cv h1{font-size:26px;margin-bottom:2px}.cv .stats{margin:14px 0}
@media print{#cover{display:none!important}}

</style></head><body>
<main id="app"><h1>Loading…</h1></main><div id="sheet" hidden></div>
<div id="cover"></div><nav id="nav"></nav>
<script>
const SEED=[]
const DATA_VERSION='2026-10-07';
const F1=200,N1=3,F2=269,DUE=25;
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>'R'+(n||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
const cls=s=>/Overdue/.test(s)?'bad':/Part|Due/.test(s)?'warn':/Paid/.test(s)?'ok':'mute';
let note='',err='',db=null,owner=false,clients=[],pays=[],tab='d',coverOn=true,flt='All',q='',sel=null,busy='',pending=0;
const iso=d=>d.toISOString().slice(0,10);
function calc(c){const t=new Date(),d=c.start?new Date(c.start+'T00:00'):null;
 const n=d&&d<=t?(t.getFullYear()-d.getFullYear())*12+t.getMonth()-d.getMonth()+1:0;
 const paid=pays.filter(p=>p.cid===c.id).reduce((s,p)=>s+p.amt,0),due=Math.min(n,N1)*F1+Math.max(0,n-N1)*F2,bal=due-paid,cur=n<=N1?F1:F2,early=t.getDate()<=DUE;
 const over=Math.max(0,bal-(early?cur:0)),cov=paid<=0?0:paid<N1*F1?Math.floor(paid/F1):N1+Math.floor((paid-N1*F1)/F2);
 return{n,paid,due,bal,cur,over,behind:Math.max(0,n-(early?1:0)-cov),st:n==0?'Not billing':bal<=0?'Paid up':over>0?'Overdue':'Due'}}
function render(){if(!db){$('#app').innerHTML='<div class="card"><b>Database not available.</b><small>Open this app from its claude.ai link while signed in to Claude, then refresh. '+e(err)+'</small></div>';return}
 clients.forEach(c=>c.k=calc(c));const A=clients.filter(c=>c.k.n>0);
 const sum=f=>A.reduce((s,c)=>s+f(c.k),0),od=clients.filter(c=>c.k.st=='Overdue');
 let h=`<h1>Busobengwe · Alexandra Hostel FWA</h1><small>${err?'⚠ '+e(err):'Saved on this phone ✓'+(note?' · '+e(note):'')}</small><div class="stats"><div class="card"><small>Billed to date</small><b>${R(sum(k=>k.due))}</b></div><div class="card"><small>Collected</small><b>${R(sum(k=>k.paid))}</b></div><div class="card"><small>Outstanding</small><b>${R(sum(k=>Math.max(0,k.bal)))}</b></div><div class="card"><small>Overdue (${od.length} clients)</small><b class="badt">${R(sum(k=>k.over))}</b></div></div>`;
 if(tab=='d')h=h.split('<div class="stats">')[0]+dash(od);
 if(!clients.length)h+=`<div class="card np">No clients yet.<small>Open <b>Add / Backup</b> to add your first client or restore a backup.</small><small id="msg">${e(busy)}</small></div>`;
 if(tab=='a')h+=`<div class="card np" style="margin-top:8px"><b>Backup &amp; restore</b><small>Your data is stored only on this phone. Tap Show backup, copy the text, and send it to yourself (WhatsApp or email) now and then. To restore, paste a backup here and tap Restore.</small><textarea id="bk" rows="5" placeholder="Backup text appears here – or paste a backup to restore"></textarea><div class="bar"><button data-bk>Show backup</button><button data-rs>Restore from text</button></div><small id="msg">${e(busy)}</small></div>`;
 if(tab=='a')h+=form({});
 if(tab=='c'){h+=`<input id="q" placeholder="Search name, room, cell, order no." value="${e(q)}"><div class="chips">${['All','Overdue','Due','Paid up','Not billing'].map(s=>`<button data-f="${s}" class="${flt==s?'on':''}">${s}</button>`).join('')}</div>`;
  const t=q.toLowerCase();h+=clients.filter(c=>(flt=='All'||c.k.st==flt)&&(!t||[c.name,c.unit,c.cell,c.order].join(' ').toLowerCase().includes(t))).sort((a,b)=>(a.name||'~').localeCompare(b.name||'~')).slice(0,150).map(row).join('')}
 if(tab=='o'){h+=`<small>Sorted by amount overdue</small>`+od.sort((a,b)=>b.k.over-a.k.over).map(c=>row(c,1)).join('')||'<div class="card">Nobody is overdue 🎉</div>'}
 $('#app').innerHTML=h;$('#nav').innerHTML=[['d','Dashboard'],['c','Clients'],['o','Overdue'],['a','Add / Backup']].map(([k,l])=>`<button data-t="${k}" class="${tab==k?'on':''}">${l}</button>`).join('');
 const i=$('#q');if(i&&document.activeElement===document.body&&q){}
 if(sel)detail(clients.find(c=>c.id==sel));drawCover()}

 return`<div class="row" data-open="${e(c.id)}"><div><b>${e(c.name||'Order '+c.order)}</b><small>${e(c.unit||'')}${c.batch?' · '+e(c.batch):''}${x?` · ${k.behind} mth behind`:''}</small>${x&&c.cell?`<div class="bar np"><a class="b" href="tel:${e(c.cell)}">📞 Call</a><a class="b" target="_blank" rel="noopener" href="https://wa.me/${w}?text=${encodeURIComponent(remind(c))}">WhatsApp</a></div>`:''}</div><div class="r"><span class="pill ${cls(k.st)}">${k.st}</span><small>${x?R(k.over):k.bal>0?R(k.bal):''}</small></div></div>`}
function form(c){const f=(id,l,v='',t='text')=>`<div><label>${l}</label><input id="f_${id}" type="${t}" value="${e(v)}"></div>`;
 return`<div class="card np" style="margin-top:8px"><b>${c.id?'Edit client':'Add client'}</b><div class="g">${f('name','Full name',c.name)}${f('cell','Cell no.',c.cell)}${f('unit','Unit / Room',c.unit)}${f('idno','ID number',c.idno)}${f('batch','Batch (e.g. Oct 26)',c.batch)}${f('order','Order no.',c.order)}${f('inv','Invoice no.',c.inv)}${f('start','Billing start (first billed month)',c.start,'date')}</div><label><input type="checkbox" id="f_deliv" style="width:auto" ${c.deliv?'checked':''}> Delivered</label><label>Notes</label><textarea id="f_notes">${e(c.notes)}</textarea><div class="bar"><button class="p" data-save="${e(c.id||'')}">Save</button></div></div>`}
function detail(c){if(!c){sel=null;return}const k=c.k,t0=new Date();t0.setHours(0,0,0,0);
 const my=pays.filter(p=>p.cid==c.id).sort((a,b)=>a.date<b.date?1:-1);let cum=0,rows='';const s=c.start?new Date(c.start+'T00:00'):null;
 for(let i=0;i<k.n;i++){const ch=i<N1?F1:F2,al=Math.max(0,Math.min(ch,k.paid-cum));cum+=ch;const m=new Date(s.getFullYear(),s.getMonth()+i,1),dd=new Date(m.getFullYear(),m.getMonth(),DUE),st=al>=ch?'Paid':dd>=t0?'Due':al>0?'Part paid':'Overdue';
  rows+=`<tr><td>${m.toLocaleDateString('en-ZA',{month:'short',year:'numeric'})}</td><td>${R(ch)}</td><td>${R(al)}</td><td class="${cls(st)}t">${st}</td></tr>`}
 const sh=$('#sheet');sh.hidden=false;if(sh.dataset.id==c.id&&sh.contains(document.activeElement)&&document.activeElement.tagName=='INPUT')return;sh.dataset.id=c.id;
 sh.innerHTML=`<div><div class="bar np"><button data-close>← Back</button><button data-print>🖨 Print statement</button><button data-edit="${e(c.id)}">Edit</button></div>
 <div id="ed"></div><h1 style="margin-bottom:2px">Statement of Account</h1><small>Busobengwe Group · 2021/56380/07 · 155 West Street, Sandton, Johannesburg, 2031 · busobengwe@embo.org.za · 083 222 7791</small>
 <p><b>${e(c.name||'Order '+c.order)}</b> <span class="pill ${cls(k.st)}">${k.st}</span><small>${e(c.unit||'')} · ${e(c.cell||'')} · Client ${e(c.id)} · Order ${e(c.order||'')} · Invoice ${e(c.inv||'')} · ${new Date().toLocaleDateString('en-ZA',{dateStyle:'long'})}</small></p>
 <div class="stats"><div class="card"><small>Billed</small><b>${R(k.due)}</b></div><div class="card"><small>Paid</small><b>${R(k.paid)}</b></div><div class="card"><small>Balance owing</small><b class="badt">${R(k.bal)}</b></div><div class="card"><small>Overdue</small><b class="badt">${R(k.over)}</b></div></div>
 <div class="card np"><b>Record payment</b><div class="g"><div><label>Amount (R)</label><input id="p_amt" type="number" inputmode="decimal" value="${k.cur}"></div><div><label>Date paid</label><input id="p_date" type="date" value="${iso(new Date())}"></div><div><label>Method</label><select id="p_m"><option>EFT</option><option>Cash</option><option>Card</option><option>Mobile money</option></select></div><div><label>Reference</label><input id="p_ref"></div></div><div class="bar"><button class="p" data-pay="${e(c.id)}">Save payment</button></div></div>
 <b>Monthly breakdown</b><table><tr><th>Month</th><th>Charge</th><th>Paid</th><th>Status</th></tr>${rows||'<tr><td colspan=4>Not billing yet – set Delivered and a billing start date.</td></tr>'}</table>
 <b>Payments received</b><table>${my.map(p=>`<tr><td>${e(p.date)}</td><td>${R(p.amt)}</td><td>${e(p.method||'')} ${e(p.ref||'')}</td><td class="np"><button data-del="${p.pid}" style="padding:2px 8px">×</button></td></tr>`).join('')||'<tr><td>None yet</td></tr>'}</table>
 <small>First ${N1} months R${F1}, then R${F2} a month. Payment due by the ${DUE}th of each month. Payments are applied to the oldest month first.</small></div>`}

const remind=c=>`Hi ${(c.name||'').split(' ')[0]||'there'}, this is Busobengwe Group (Alexandra Hostel internet). Your account shows ${R(c.k.over)} overdue. Payments are due by the ${DUE}th of each month. Please pay and send your proof of payment. Thank you.`;
const ST=[['Paid up','#5fd37a'],['Due','#ffc44d'],['Overdue','#ff6b6b'],['Not billing','#8a8a8a']],kk=v=>v>=1e4?Math.round(v/1e3)+'k':v>=1e3?(v/1e3).toFixed(1)+'k':Math.round(v);
const hb=rows=>rows.map(r=>{const t=r.s.reduce((a,x)=>a+x[0],0),mx=Math.max(1,...rows.map(q=>q.s.reduce((a,x)=>a+x[0],0)));return`<div class="hb"><small>${e(r.l)}</small><div class="t">${r.s.map(([v,c])=>v?`<i style="width:${v/mx*100}%;background:${c}"></i>`:'').join('')}</div><b>${t}</b></div>`}).join('');
function donut(items,tot){let o=0;const r=52,C=2*Math.PI*r;return`<svg viewBox="0 0 140 140" width="140" height="140"><circle cx="70" cy="70" r="${r}" fill="none" stroke="#2a2a2a" stroke-width="18"/>${items.map(([l,v,c])=>{if(!v||!tot)return'';const n=C*v/tot,x=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${c}" stroke-width="18" stroke-dasharray="${n} ${C-n}" stroke-dashoffset="${-o}" transform="rotate(-90 70 70)"/>`;o+=n;return x}).join('')}<text x="70" y="70" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">${tot}</text><text x="70" y="88" text-anchor="middle" fill="#b3b3b3" font-size="11">clients</text></svg>`}
function bars(M){const mx=Math.max(1,...M.flatMap(m=>[m.b,m.c])),W=320,H=120,g=W/M.length,bw=Math.min(24,g/2.6);
 return`<svg viewBox="0 0 ${W} ${H+34}" width="100%">${[0,.5,1].map(f=>`<line x1="0" x2="${W}" y1="${16+H*(1-f)}" y2="${16+H*(1-f)}" stroke="#2a2a2a"/>`).join('')}${M.map((m,i)=>{const x=i*g+g/2,a=m.b/mx*H,b=m.c/mx*H;return`<rect x="${x-bw-1}" y="${16+H-a}" width="${bw}" height="${a}" rx="3" fill="#e60000"/><rect x="${x+1}" y="${16+H-b}" width="${bw}" height="${b}" rx="3" fill="#5fd37a"/><text x="${x-bw/2}" y="${12+H-a}" text-anchor="middle" fill="#ccc" font-size="9">${m.b?kk(m.b):''}</text><text x="${x+bw/2+1}" y="${12+H-b}" text-anchor="middle" fill="#5fd37a" font-size="9">${m.c?kk(m.c):''}</text><text x="${x}" y="${H+32}" text-anchor="middle" fill="#b3b3b3" font-size="11">${m.l}</text>`}).join('')}</svg>`}
function dash(od){const A=clients.filter(c=>c.k.n>0),S=f=>A.reduce((s,c)=>s+f(c.k),0),T=clients.length,cnt=s=>clients.filter(c=>c.k.st==s).length;
 const now=new Date(),ym=d=>d.getFullYear()*12+d.getMonth(),mk=ym(now),ymS=now.toISOString().slice(0,7);
 const due=S(k=>k.due),paid=pays.reduce((s,p)=>s+p.amt,0),out=S(k=>Math.max(0,k.bal)),ov=S(k=>k.over),rate=due?Math.min(100,Math.round(paid/due*100)):0;
 const tm=pays.filter(p=>String(p.date).startsWith(ymS)),cm=tm.reduce((s,p)=>s+p.amt,0);
 let first=mk;clients.forEach(c=>{if(c.start)first=Math.min(first,ym(new Date(c.start+'T00:00')))});first=Math.max(first,mk-5);const M=[];
 for(let m=first;m<=mk;m++){let b=0;clients.forEach(c=>{if(!c.start)return;const i=m-ym(new Date(c.start+'T00:00'));if(i>=0)b+=i<N1?F1:F2});
  M.push({b,c:pays.filter(p=>ym(new Date(p.date+'T00:00'))==m).reduce((s,p)=>s+p.amt,0),l:new Date(Math.floor(m/12),m%12,1).toLocaleDateString('en-ZA',{month:'short'})})}
 const tile=(l,v,sub,c,go)=>`<div class="card kpi" ${go?`data-go="${go}"`:''}><small>${l}</small><b class="${c||''}">${v}</b><small>${sub}</small></div>`;
 const batches=[...new Set(clients.map(c=>c.batch||'—'))].sort(),meth={};pays.forEach(p=>meth[p.method||'Other']=(meth[p.method||'Other']||0)+1);
 const unn=clients.filter(c=>c.k.n>0&&!c.name).length,nocell=clients.filter(c=>c.name&&!c.cell).length;
 const top=[...od].sort((a,b)=>b.k.over-a.k.over),wa=od.length?'https://wa.me/?text='+encodeURIComponent('Overdue FWA accounts – '+now.toLocaleDateString('en-ZA')+'\n'+top.slice(0,40).map((c,i)=>`${i+1}. ${c.name||'Order '+c.order} (${c.unit||'-'}) ${R(c.k.over)}`).join('\n')):'';
 return`<div class="kg">${tile('Clients',T,clients.filter(c=>c.deliv).length+' delivered · '+A.length+' billing','','All')}${tile('Collected',R(paid),R(cm)+' this month')}${tile('Billed to date',R(due),'what clients owe in total')}${tile('Outstanding',R(out),'unpaid balance')}${tile('Overdue',R(ov),od.length+' clients','badt','Overdue')}<div class="card kpi"><small>Collection rate</small><b>${rate}%</b><div class="meter"><i style="width:${rate}%"></i></div></div></div>
 <div class="card"><h3>Clients by status</h3><div class="dn">${donut(ST.map(([s,c])=>[s,cnt(s),c]),T)}<div>${ST.map(([s,c])=>`<div class="lgrow" data-go="${s}"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${c};margin-right:6px"></i>${s}</span><b>${cnt(s)}</b></div>`).join('')}</div></div></div>
 <div class="card"><h3>Billed vs collected (R)</h3>${bars(M)}<div class="lg"><span><i style="background:#e60000"></i>Billed</span><span><i style="background:#5fd37a"></i>Collected</span><span>${pays.length} payments · ${tm.length} this month</span></div>${pays.length?'':'<small>No payments recorded yet – add one from a client.</small>'}</div>
 <div class="card"><h3>Clients by batch</h3>${hb(batches.map(b=>({l:b,s:ST.map(([s,c])=>[clients.filter(x=>(x.batch||'—')==b&&x.k.st==s).length,c])})))}</div>
 <div class="card"><h3>Overdue by age</h3>${od.length?hb([1,2,3].map(n=>({l:n<3?n+' month'+(n>1?'s':''):'3+ months',s:[[od.filter(c=>n<3?c.k.behind==n:c.k.behind>=3).length,'#ff6b6b']]}))):'<small>Nobody is overdue 🎉</small>'}</div>
 ${pays.length?`<div class="card"><h3>Payments by method</h3>${hb(Object.entries(meth).map(([l,v])=>({l,s:[[v,'#5fd37a']]})))}<h3 style="margin-top:12px">Recent payments</h3>${[...pays].sort((a,b)=>a.date<b.date?1:-1).slice(0,5).map(p=>{const c=clients.find(x=>x.id==p.cid)||{};return`<div class="lgrow" data-open="${e(p.cid)}"><span>${e(c.name||p.cid)}<small>${e(p.date)} · ${e(p.method||'')}</small></span><b class="okt">${R(p.amt)}</b></div>`}).join('')}</div>`:''}
 <div class="card"><h3>Biggest overdue</h3>${od.length?top.slice(0,5).map(c=>row(c,1)).join('')+`<div class="bar np"><a class="b" target="_blank" rel="noopener" href="${wa}">Share overdue list on WhatsApp</a></div>`:'<small>Nothing overdue.</small>'}</div>
 <div class="card"><h3>Data checks</h3>${unn||nocell?`${unn?`<div class="lgrow" data-go="All"><span>${unn} unnamed clients are being billed</span><b class="warnt">!</b></div>`:''}${nocell?`<div class="lgrow" data-go="All"><span>${nocell} named clients have no cell number</span><b class="warnt">!</b></div>`:''}<small>Fix these in the client's Edit screen so the numbers stay accurate.</small>`:'<small>All good ✓</small>'}</div>`}
function drawCover(){const c=$('#cover');if(!c)return;c.hidden=!coverOn;if(!coverOn)return;const od=clients.filter(x=>x.k&&x.k.st=='Overdue'),ym=new Date().toISOString().slice(0,7),col=pays.filter(p=>String(p.date).startsWith(ym)).reduce((s,p)=>s+p.amt,0);
 c.innerHTML=`<div class="hero"></div><div class="cv"><h1>Alexandra Hostel FWA</h1><small>Client &amp; Payments Manager · ${new Date().toLocaleDateString('en-ZA',{dateStyle:'long'})}</small><div class="stats"><div class="card"><small>Clients</small><b>${clients.length}</b></div><div class="card"><small>Collected this month</small><b>${R(col)}</b></div><div class="card"><small>Overdue accounts</small><b class="badt">${od.length}</b></div><div class="card"><small>Amount overdue</small><b class="badt">${R(od.reduce((s,x)=>s+x.k.over,0))}</b></div></div><button class="p" data-cover style="width:100%;padding:14px;font-size:16px">Open dashboard →</button><small style="text-align:center;margin-top:12px">Busobengwe Group · 2021/56380/07</small></div>`}
const say=t=>{const m=$('#msg');if(m)m.textContent=t};
const val=id=>($('#f_'+id)||{}).value||'';
async function saveClient(id){if(!val('name')&&!val('order'))return;const n=Math.max(0,...clients.map(c=>+c.id.slice(1)||0))+1;id=id||'C'+String(n).padStart(3,'0');
 await db.doc('clients/'+id).set({name:val('name'),cell:val('cell'),unit:val('unit'),idno:val('idno'),batch:val('batch'),order:val('order'),inv:val('inv'),start:val('start'),deliv:$('#f_deliv').checked,notes:val('notes'),acct:(clients.find(c=>c.id==id)||{}).acct||'VB038633'});tab='c';sel=id;render()}
const dstr=d=>d instanceof Date?iso(new Date(d.getTime()+43200000)):'';
async function seedLoad(){let i=0;try{for(const r of SEED){busy=`Loading ${++i}/${SEED.length}…`;const m=$('#msg');if(m)m.textContent=busy;await db.doc('clients/'+r[0]).set({name:r[1],cell:r[2],unit:r[3],batch:r[4],order:r[5],inv:r[6],deliv:!!r[7],start:r[8],idno:'',addr:'',acct:'VB038633',notes:''})}busy='Done – '+SEED.length+' clients loaded.'}catch(x){err=x.message||x.code||String(x);busy='Stopped at '+i}render()}
async function doImport(file){if(typeof XLSX=='undefined')throw new Error('Excel reader did not load – use the Load button instead');const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true}),S=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}).slice(4),t=x=>String(x??'').trim();
 const cs=S('Clients').filter(r=>t(r[1])||t(r[8])),ps=S('Payments').filter(r=>t(r[2])&&+r[5]>0);let i=0;
 for(const r of cs){busy=`Importing clients ${++i}/${cs.length}…`;const m=$('#msg');if(m)m.textContent=busy;
  await db.doc('clients/'+t(r[0])).set({name:t(r[1]),idno:t(r[2]),cell:t(r[3]),unit:t(r[4]),addr:t(r[5]),batch:t(r[6]),acct:t(r[7]),order:t(r[8]),inv:t(r[9]),deliv:t(r[12]).toUpperCase()=='Y',start:dstr(r[14]),notes:''})}
 for(const r of ps)await db.collection('payments').add({cid:t(r[2]),date:dstr(r[1])||iso(new Date()),amt:+r[5],method:t(r[6]),ref:t(r[7])});
 busy=`Done: ${cs.length} clients, ${ps.length} payments imported.`;render()}
document.addEventListener('click',async ev=>{const t=ev.target,d=t.closest('[data-open],[data-f],[data-t],[data-save],[data-pay],[data-seed],[data-cover],[data-go],[data-bk],[data-rs],[data-close],[data-print],[data-edit],[data-del]');if(!d)return;const D=d.dataset;
 try{if(D.open!==undefined){if(t.closest('a'))return;sel=D.open;render()}
 else if(D.f){flt=D.f;render()}else if(D.t){tab=D.t;sel=null;$('#sheet').hidden=true;render()}

 else if(D.close!==undefined){sel=null;$('#sheet').hidden=true;render()}

 else if(D.bk!==undefined){const t=$('#bk');t.value=db.dump();t.focus();t.select();say('Copy all of this text and keep it safe.')}
 else if(D.rs!==undefined){if(d.textContent!='Tap again to replace ALL data'){d.textContent='Tap again to replace ALL data';return}db.load($('#bk').value);busy='Restored ✓';d.textContent='Restore from text';tab='c';render()}
 else if(D.seed!==undefined)await seedLoad()
 else if(D.print!==undefined)window.print()
 else if(D.edit){$('#ed').innerHTML=form(clients.find(c=>c.id==D.edit))}
 else if(D.pay){const a=+$('#p_amt').value;if(!(a>0))return;await db.collection('payments').add({cid:D.pay,date:$('#p_date').value,amt:a,method:$('#p_m').value,ref:$('#p_ref').value})}
 else if(D.del){if(d.textContent=='×'){d.textContent='Sure?';return}await db.doc('payments/'+D.del).delete()}}catch(x){err=x.message||x.code||String(x);render()}});
document.addEventListener('input',ev=>{if(ev.target.id=='q'){q=ev.target.value;const p=ev.target.selectionStart;render();const i=$('#q');i.focus();i.setSelectionRange(p,p)}});
document.addEventListener('change',ev=>{if(ev.target.id=='imp'&&ev.target.files[0])doImport(ev.target.files[0]).catch(x=>{busy='Import failed: '+(x.message||x);render()})});
let raf;const sched=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(render)};
function localDB(){let S={clients:{},payments:{}},L={clients:[],payments:[]},had=false;
 try{const j=localStorage.getItem('fwa_v1');if(j){S=JSON.parse(j);had=true}}catch(x){err='This browser blocks saving here – make Backups often.'}
 const save=()=>{try{localStorage.setItem('fwa_v1',JSON.stringify(S))}catch(x){err='Could not save on this phone – make a Backup now.'}};
 if(!had)S.ver=null;
 if(S.ver!==DATA_VERSION){let n=0;SEED.forEach(r=>{const x={name:r[1],cell:r[2],unit:r[3],batch:r[4],order:r[5],inv:r[6],deliv:!!r[7],start:r[8]},o=S.clients[r[0]];
  if(!o){S.clients[r[0]]={...x,idno:'',addr:'',acct:'VB038633',notes:''};n++;return}
  let ch=0;for(const k in x){if(x[k]!==''&&x[k]!==false&&x[k]!==o[k]){o[k]=x[k];ch=1}}n+=ch});
  S.ver=DATA_VERSION;save();if(had)note='Updated from spreadsheet (7 Oct 2026): '+n+' clients changed'}
 const snap=c=>({docs:Object.entries(S[c]).map(([id,d])=>({id,data:()=>d}))}),emit=c=>L[c].forEach(f=>f(snap(c)));
 return{dump:()=>JSON.stringify(S),load(t){const o=JSON.parse(t);if(!o.clients||!o.payments)throw new Error('That is not a valid backup');S={clients:o.clients,payments:o.payments,ver:o.ver};save();emit('clients');emit('payments')},
  collection:c=>({onSnapshot(f){L[c].push(f);f(snap(c))},async add(d){const id='p'+Date.now()+Math.random().toString(36).slice(2,6);S[c][id]=d;save();emit(c);return{id}}}),
  doc(p){const[c,id]=p.split('/');return{async set(d){S[c][id]=d;save();emit(c)},async delete(){delete S[c][id];save();emit(c)}}}}}
(async()=>{try{db=localDB()}catch(x){err=String(x&&x.message||x)}
 if(db){db.collection('clients').onSnapshot(s=>{clients=s.docs.map(d=>({...d.data(),id:d.id}));sched()},x=>{err=x.message||x.code;sched()});
  db.collection('payments').onSnapshot(s=>{pays=s.docs.map(d=>({...d.data(),pid:d.id,amt:+d.data().amt||0}));sched()},x=>{err=x.message||x.code;sched()})}
 render()})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
